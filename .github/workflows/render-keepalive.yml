name: Render Keep-Alive

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "RENDER_HEALTHCHECK_URL is not set"
            exit 1
          fi

          echo "Pinging: $HEALTHCHECK_URL"
          curl --fail --silent --show-error --max-time 25 "$HEALTHCHECK_URL"
          echo "Keep-alive ping sent successfully"
